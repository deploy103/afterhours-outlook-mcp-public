# Include inside the existing HTTPS server, only after coordinated deployment approval.
# Strip /outlook prefix. Keep Authorization and external Host. Do not proxy any OAuth callback.
location = /outlook/mcp {
    proxy_pass http://127.0.0.1:8004/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host mcp.example.com;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 90s;
    client_max_body_size 256k;
    add_header Cache-Control "no-store" always;
    access_log off;
}
